apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-error-backend
  namespace: kubernetes-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-error-backend
  template:
    metadata:
      labels:
        app: custom-error-backend
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Dashboard page not found"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: custom-error-backend
  namespace: kubernetes-dashboard
spec:
  selector:
    app: custom-error-backend
  ports:
    - port: 80
      targetPort: 5678